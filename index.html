<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sombras da Guerra — RPG da Segunda Guerra Mundial</title>
<style>
  :root{
    --bg:#14110d; --paper:#1e1a14; --panel:#241f17; --ink:#ddd3c2;
    --muted:#8f8371; --accent:#c9a35c; --accent2:#a67c3d;
    --danger:#b8503f; --success:#6b8e4e; --border:#3a3227;
    --shadow:0 2px 12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(circle at 20% 0%, #1d1810 0%, var(--bg) 60%) fixed;
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    font-size:16px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:920px; margin:0 auto; padding:18px 18px 90px; min-height:100vh;}
  h1,h2,h3{margin:0 0 .5em; letter-spacing:.03em}
  h1{font-size:2.2em; color:var(--accent); text-shadow:0 1px 0 #000; letter-spacing:.06em}
  h2{font-size:1.4em; color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:.3em}
  h3{font-size:1.05em; color:var(--accent2); letter-spacing:.08em; text-transform:uppercase}
  p{margin:.5em 0}
  .mono,code,pre{font-family: 'Courier New', monospace; font-size:.92em}
  .title-screen{text-align:center; padding-top:10vh}
  .title-screen .subtitle{color:var(--muted); font-style:italic; letter-spacing:.15em; margin-bottom:3em}
  .menu button{display:block; width:280px; margin:10px auto}
  button{
    background:linear-gradient(#2e2619,#241e15); color:var(--ink);
    border:1px solid var(--border); padding:10px 18px; cursor:pointer;
    font-family:inherit; font-size:1em; border-radius:2px;
    letter-spacing:.04em; transition:all .15s;
  }
  button:hover:not(:disabled){border-color:var(--accent); color:var(--accent); background:linear-gradient(#3a2f1e,#2e2619)}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.primary{background:linear-gradient(#5a4523,#3d2f18); border-color:var(--accent2)}
  button.primary:hover{background:linear-gradient(#6b5429,#4a3a1e); color:#fff}
  .card{background:var(--paper); border:1px solid var(--border); padding:18px; margin:14px 0; border-radius:3px; box-shadow:var(--shadow)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
  .option{
    background:var(--panel); border:1px solid var(--border); padding:12px 14px;
    cursor:pointer; border-radius:2px; transition:all .12s;
  }
  .option:hover{border-color:var(--accent2); background:#2c2619}
  .option.selected{border-color:var(--accent); background:#3a2f1c; box-shadow:inset 0 0 0 1px var(--accent)}
  .option .opt-title{color:var(--accent); font-weight:bold; letter-spacing:.04em}
  .option .opt-desc{color:var(--muted); font-size:.9em; margin-top:.3em; font-family:Georgia,serif}

  /* Game view */
  #game{display:none}
  #log{
    background:var(--paper); border:1px solid var(--border);
    padding:18px 20px; border-radius:3px; min-height:50vh;
    max-height:60vh; overflow-y:auto; box-shadow:var(--shadow);
  }
  #log p{margin:.7em 0}
  #log .sys{color:var(--accent); font-family:'Courier New',monospace; font-size:.9em}
  #log .dice{color:var(--accent2); font-family:'Courier New',monospace; font-size:.9em; background:#1a1610; padding:8px 12px; border-left:3px solid var(--accent2); margin:.6em 0}
  #log .dmg{color:var(--danger)}
  #log .ok{color:var(--success)}
  #log .narr{font-style:italic; color:#cfc5b4}
  #log .choice{color:var(--accent); cursor:pointer; border-bottom:1px dashed var(--border)}
  #log .choice:hover{color:#fff}

  #bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--panel);
    border-top:1px solid var(--border); padding:10px 18px; z-index:10;
  }
  #bar-inner{max-width:920px; margin:0 auto; display:flex; gap:10px}
  #cmd{
    flex:1; background:#14110d; color:var(--ink); border:1px solid var(--border);
    padding:10px 14px; font-family:Georgia,serif; font-size:1em; border-radius:2px;
  }
  #cmd:focus{outline:none; border-color:var(--accent2)}

  #status{
    display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    color:var(--muted); font-size:.88em; margin-bottom:10px;
    font-family:'Courier New',monospace;
  }
  #status b{color:var(--accent)}
  #status .hp b{color:var(--danger)}
  #status .hp.high b{color:var(--success)}

  .sheet-row{display:flex; justify-content:space-between; border-bottom:1px dotted var(--border); padding:4px 0}
  .sheet-attr{display:inline-block; min-width:60px; margin-right:10px; color:var(--accent)}
  .tag{display:inline-block; background:#2c2619; border:1px solid var(--border); padding:2px 8px; margin:2px; border-radius:2px; font-size:.85em}
  .warn{color:var(--danger)}
  .attr-row{display:flex; align-items:center; gap:8px; padding:4px 0}
  .attr-row label{flex:1; color:var(--accent)}
  .attr-row .val{width:40px; text-align:center; font-family:monospace; font-size:1.1em; color:#fff}
  .attr-row button{padding:2px 10px; font-size:1em}
  .pts-left{color:var(--accent); font-family:monospace}
  .hint{color:var(--muted); font-size:.85em; font-style:italic; margin-top:.4em}
  .btnrow{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}
  .combat-bar{background:#2a1815; border:1px solid var(--danger); padding:10px; margin:10px 0; border-radius:2px}
  .combat-bar .enemy{color:var(--danger); font-family:monospace}
  ::selection{background:var(--accent2); color:#000}
  #log::-webkit-scrollbar{width:8px}
  #log::-webkit-scrollbar-thumb{background:#3a3227; border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <div id="title"></div>
  <div id="creation" style="display:none"></div>
  <div id="game">
    <div id="status"></div>
    <div id="log"></div>
  </div>
</div>
<div id="bar" style="display:none">
  <div id="bar-inner">
    <input id="cmd" placeholder="O que você faz? (linguagem natural, ou /ajuda)" autocomplete="off">
    <button onclick="submitCmd()" class="primary">Enviar</button>
  </div>
</div>

  try{ const d = localStorage.getItem(SAVE_KEY); return d ? JSON.parse(d) : null; }catch(e){ return null; }
}

// ==================== DADOS ====================
function doRoll(sides,count=1){
  const rolls=[]; for(let i=0;i<count;i++) rolls.push(rnd(sides));
  return {rolls,sides,count,total:rolls.reduce((a,b)=>a+b,0)};
}
function doCheck(attrKey,skillKey,dc,adv=0){
  const c=S.character;
  const attrVal=c.attributes[attrKey];
  const sk = skillKey ? (c.skills[skillKey]||0) : 0;
  const mod = attrMod(attrVal);
  const skillBonus = Math.floor(sk/2);
  const r1=rnd(20), r2=rnd(20);
  let base;
  if(adv>0) base=Math.max(r1,r2);
  else if(adv<0) base=Math.min(r1,r2);
  else base=r1;
  const total=base+mod+skillBonus;
  let crit=0;
  if(base===20) crit=1; else if(base===1) crit=-1;
  let success = crit===1 ? true : crit===-1 ? false : total>=dc;
  return {base,rolls:[r1,r2],mod,skillBonus,skill,attrKey,dc,total,success,crit,adv,attrVal};
}

function fmtCheck(ch,label){
  let advTxt='';
  if(ch.adv>0) advTxt=` [vantagem — d20: ${ch.rolls[0]}, ${ch.rolls[1]}, usa ${ch.base}]`;
  else if(ch.adv<0) advTxt=` [desvantagem — d20: ${ch.rolls[0]}, ${ch.rolls[1]}, usa ${ch.base}]`;
  const skillName = ch.skill ? (SKILLS[ch.skill]?.n || ch.skill) : '—';
  const skillLvl = ch.skill ? (S.character.skills[ch.skill]||0) : 0;
  const critTxt = ch.crit===1 ? ' · SUCESSO CRÍTICO' : ch.crit===-1 ? ' · FALHA CRÍTICA' : '';
  const res = ch.success ? '<span class="ok">SUCESSO</span>' : '<span class="dmg">FALHA</span>';
  return `<div class="dice"><b>AÇÃO:</b> ${esc(label)}<br>
    d20 = ${ch.base}${advTxt}<br>
    ${ATTRS[ch.attrKey]} ${fmt(ch.mod)} · ${skillName} (nv ${skillLvl}) ${fmt(ch.skillBonus)}<br>
    <b>Total: ${ch.total}</b> vs Dificuldade ${ch.dc} → ${res}${critTxt}</div>`;
}

function renderAttrs(box){
  const c=S.creation;
  const cls=CLASSES[c.cls];
  if(!c.attrBase){
    c.attrBase={}; Object.keys(ATTRS).forEach(k=>c.attrBase[k]=cls.base[k]);
    c.attrBonus={}; Object.keys(ATTRS).forEach(k=>c.attrBonus[k]=0);
    c.skills={}; Object.assign(c.skills, cls.skills);
  }
  const totalLeft = 8 - Object.values(c.attrBonus).reduce((a,b)=>a+b,0);
  const rows=Object.entries(ATTRS).map(([k,label])=>{
    const v=c.attrBase[k]+c.attrBonus[k];
    const prim=cls.prim.includes(k)?'<span style="color:var(--accent2);font-size:.8em"> ★</span>':'';
    return `<div class="attr-row">
      <label>${label}${prim}</label>
      <button ${totalLeft<=0||v>=18?'disabled':''} onclick="adjAttr('${k}',1)">+</button>
      <span class="val">${v}</span>
      <button ${c.attrBonus[k]<=0?'disabled':''} onclick="adjAttr('${k}',-1)">−</button>
      <span style="color:var(--muted);font-size:.85em;min-width:60px">mod ${fmt(attrMod(v))}</span>
    </div>`;
  }).join('');

  // skills to boost
  const boostable=Object.entries(SKILLS).filter(([k])=>!(k in cls.skills)).slice(0,40);
  const skillOpts=boostable.map(([k,s])=>{
    const taken=c.skills[k]||0;
    return `<label style="display:block;padding:4px">
      <input type="checkbox" ${taken>0?'checked disabled':''} onchange="toggleSkillBoost('${k}',this.checked)">
      ${s.n} <span style="color:var(--muted)">(${ATTRS[s.a]})</span>
    </label>`;
  }).join('');
  const boostCount=Object.keys(c.skills).length - Object.keys(cls.skills).length;
  const boostLeft=2-boostCount;

  box.innerHTML=`<div class="card">
    <h2>Etapa 5 · Atributos e Habilidades</h2>
    <p>Distribua <span class="pts-left" id="pts">${totalLeft}</span> pontos entre os atributos (máx. 18).</p>
    <div class="grid2">${rows}</div>
    <hr style="border-color:var(--border);margin:16px 0">
    <p>Escolha até <b>2</b> habilidades extras para reforçar (ficam nível 2). <span class="pts-left">Restam: ${boostLeft}</span></p>
    <div style="max-height:220px;overflow-y:auto;border:1px solid var(--border);padding:8px;background:#181410">${skillOpts}</div>
    <div class="btnrow">
      <button onclick="S.creation.step=3;S.creation.attrBase=null;showCreation()">← Voltar</button>
      <button class="primary" onclick="S.creation.step=5;showCreation()">Avançar →</button>
    </div>
  </div>`;
}

function adjAttr(k,d){
  const c=S.creation;
  const totalLeft = 8 - Object.values(c.attrBonus).reduce((a,b)=>a+b,0);
  const cur=c.attrBase[k]+c.attrBonus[k];
  if(d>0 && totalLeft>0 && cur<18){ c.attrBonus[k]+=1; showCreation(); }
  if(d<0 && c.attrBonus[k]>0){ c.attrBonus[k]-=1; showCreation(); }
}

function toggleSkillBoost(k,checked){
  const c=S.creation;
  const cls=CLASSES[c.cls];
  const extras=Object.keys(c.skills).filter(x=>!(x in cls.skills));
  if(checked){
    if(extras.length>=2){ return; }
    c.skills[k]=2;
  } else {
    delete c.skills[k];
  }
  showCreation();
}

function renderReview(box){
  const c=S.creation;
  const cls=CLASSES[c.cls];
  const nat=NATIONS[c.nation];
  const per=PERIODS[c.period];

function startCampaign(){
  const c=S.creation;
  const cls=CLASSES[c.cls];
  const nat=NATIONS[c.nation];
  const per=PERIODS[c.period];

  const attributes={}; Object.keys(ATTRS).forEach(k=>attributes[k]=c.attrBase[k]+c.attrBonus[k]);
  const hp = 10 + attrMod(attributes.con) + Math.floor(attributes.con/2);
  const sanity=10 + attrMod(attributes.von) + Math.floor(attributes.von/3);

  S.character={
    name:c.name, age:c.age,
    nation:c.nation, cls:c.cls, className:cls.n,
    org:nat.orgs[0] || 'Independente',
    rank: c.cls==='soldado'?'Soldado':c.cls==='oficial'?'Tenente':'Agente',
    backstory:c.backstory, appearance:c.appearance,
    attributes,
    skills:Object.assign({},c.skills),
    hp, maxHp:hp, sanity, maxSanity:sanity,
    xp:0, level:1,
    reputation:{},
    money: c.cls==='oficial'?200:100,
    inventory: [...cls.equip],
    weapons: [cls.equip[0]],
    ammo: 60,
    languages: [...nat.langs],
    contacts: [], enemies: [], wounds: [], conditions: [],
    medals: [], missionsDone: [], missionsActive: [],
    notes:[]
  };
  S.world={year:per.y, month:per.m, day:per.d, location:per.loc};
  S.log=[];
  S.scene=null; S.combat=null;
  S.creation=null;

  showGame();
  openPrologue();
}

function handleCommand(text){
  const [cmd,...rest]=text.split(/\s+/);
  const arg=rest.join(' ');
  switch(cmd.toLowerCase()){
    case '/ajuda': return cmdHelp();
    case '/ficha': return cmdSheet();
    case '/inventario': return cmdInv();
    case '/status': return cmdStatus();
    case '/missoes': return cmdMissions();
    case '/mapa': return cmdMap();
    case '/contatos': return cmdContacts();
    case '/organizacao': return cmdOrg();
    case '/historico': return cmdHistory();
    case '/rolar': return cmdRoll(arg);
    case '/salvar': return cmdSave();
    case '/carregar': return cmdLoadPrompt();
    case '/exportar': return exportSave();
    default: sys(`Comando desconhecido: ${cmd}. Use /ajuda.`);
  }
}

function cmdRoll(arg){

  if(!m){ sys('Formato inválido.'); return; }
  const n=parseInt(m[1])||1, s=parseInt(m[2]);
  if(n>20||s>100){ sys('Rolagem máxima: 20d100.'); return; }
  const r=doRoll(s,n);
  dice(`<b>Rolagem:</b> ${n}d${s} → [${r.rolls.join(', ')}] = <b>${r.total}</b>`);
}

// ==================== AÇÃO LIVRE ====================
function guessAttr(text){
  const t=text.toLowerCase();
  if(/atir|dispar|mira|arma|rifle|pistol/.test(t)) return 'des';
  if(/corre|forç|empurr|carreg|soc|brig|escal|subi|arromb/.test(t)) return 'for';
  if(/observ|escut|olh|procur|examin|not|perceb|ver/.test(t)) return 'per';
  if(/fal|convers|persuad|conv|negoci|pergunt|ped|amea|intimid|blef/.test(t)) return 'car';
  if(/pens|estud|analis|descobr|lembr|planej|raciocin|traduz|cifr|hack|mecan/.test(t)) return 'int';
  if(/resisti|aguent|suport|corr|nad|mergulh|march|escal/.test(t)) return 'con';
  if(/concentr|vontad|determina|resisti.*mente|psicol/.test(t)) return 'von';
  if(/escond|furtiv|silenc|esgueir|infiltr|roub|furt/.test(t)) return 'des';
  return 'per';
}
function guessSkill(text){
  const t=text.toLowerCase();
  if(/atir|dispar|rifle|pistol|arma de fogo/.test(t)) return 'armas_fogo';
  if(/corpo a corpo|soc|brig|faca|baionet/.test(t)) return 'combate_cc';
  if(/furtiv|escond|sorrateir|silenc/.test(t)) return 'furtividade';
  if(/disposi|falar|persuad|convenc/.test(t)) return 'persuasao';
  if(/observ|not|perceb|procur|examin/.test(t)) return 'reconhecimento';
  if(/mecanic|consert|reparar|máquina|motor/.test(t)) return 'mecanica';
  if(/cifra|código|criptograf|decifr/.test(t)) return 'criptografia';
  if(/medic|curar|bandagem|socorro|ferid/.test(t)) return 'primeiros_socorros';
  if(/sabot|explos|bomba|dinamit/.test(t)) return 'sabotagem';
  if(/naveg|bússola|mapa|rota/.test(t)) return 'navegacao';
  if(/radio|comunic|transmiss/.test(t)) return 'radio';
  if(/dirig|pilot|avião|carro/.test(t)) return 'pilotagem';
  if(/investig|interrog|pesquis/.test(t)) return 'investigacao';
  return null;
}

function resolveAction(text){
  const scene = S.scene || {};
  const t = text.toLowerCase();

  // 1) Scene hooks
  if(scene.hooks){
    for(const h of scene.hooks){
      if(h.match.some(k=>t.includes(k))) { h.run(text); return; }
    }
  }

  // 2) NPCs
  if(scene.npcs){
    for(const npc of scene.npcs){
      if(npc.match.some(k=>t.includes(k))) { talkTo(npc); return; }
    }
  }

  // 3) Exits
  if(scene.exits){
    for(const ex of scene.exits){
      if(ex.match.some(k=>t.includes(k))) { goExit(ex); return; }
    }
  }

  // 4) Choices
  if(scene.choices){
    for(const ch of scene.choices){
      if(ch.match && ch.match.some(k=>t.includes(k))) { ch.run(text); return; }
    }
  }

  // 5) Fallback: check genérica
  const attrKey = guessAttr(text);
  const skill = guessSkill(text);
  const dc = 12;
  const res = doCheck(attrKey, skill, dc);
  dice(fmtCheck(res, text));
  if(res.success){
    narr('Você executa a ação. Algo no ambiente responde — um ruído, um movimento, a leve sensação de que o mundo se ajustou ao seu esforço. Nem tudo é claro, mas o gesto produziu efeito.');
  } else {
    narr('A ação não sai como planejado. Não necessariamente um desastre — mas o resultado é outro. O mundo não se move na direção que você queria.');
    if(res.crit===-1){
      narr('E há um preço: um erro que ecoará além deste momento.');
      S.character.conditions.push('Marcado por um erro');
    }
  }
  renderStatus();
  saveLocal();
}

function goExit(ex){
  S.world.location = ex.label || S.world.location;
  narr(`Você se desloca para <b>${ex.label}</b>.`);
  if(ex.to) ex.to();
  saveLocal();
}

function talkTo(npc){
  narr(`<b>${npc.name}</b>: "${npc.line || '...'}"`);
  if(npc.hook) npc.hook();
}

// ==================== COMBATE ====================
function startCombat(enemies){
  S.combat = { round:1, enemies:enemies.map(e=>({...e})) };
  log(`<b class="dmg">═══ COMBATE ═══</b>`,'dmg');
  narr('O tempo se estreita. Cada segundo importa.');
  S.combat.enemies.forEach(e=>log(`• <b>${e.name}</b> — PV ${e.hp}/${e.maxHp} · CA ${e.ac} · Dano ${e.dmg}`));
  sys('Ações: <b>atacar</b> · <b>atirar</b> · <b>corpo a corpo</b> · <b>cobrir</b> · <b>fugir</b>');
  renderStatus();
}

function combatAction(text){
  const t=text.toLowerCase();
  const c=S.character;
  const combat=S.combat;

  if(/fug|escap|recu|correr/.test(t)){
    const res=doCheck('des','furtividade',12);
    dice(fmtCheck(res,'Fugir do combate'));
    if(res.success){
      narr('Você recua para as sombras e se afasta. Não é vitória — mas é vida.');
      S.combat=null; renderStatus(); saveLocal(); return;
    } else {
      narr('A fuga falha. Eles percebem.');
      enemyTurn(); return;
    }
  }
  if(/cobrir|abrig|escond|cobert/.test(t)){
    const res=doCheck('des','furtividade',10);
    dice(fmtCheck(res,'Buscar cobertura'));
    if(res.success){ c._cover=true; narr('Você encontra uma posição protegida. O próximo ataque contra você será com desvantagem.'); }
    else narr('Não há cobertura — você permanece exposto.');
    enemyTurn(); return;
  }

  // Attack
  const target = combat.enemies.find(e=>e.hp>0);
  if(!target){ endCombat(); return; }
  const skill = /corpo|soc|brig|faca/.test(t) ? 'combate_cc' : 'armas_fogo';
  const attr = SKILLS[skill].a;
  const res=doCheck(attr, skill, target.ac);
  dice(fmtCheck(res, `Atacar ${target.name}`));
  if(res.success){
    const base = skill==='armas_fogo'?rnd(10)+2:rnd(6)+1;
    const dmg = base + Math.max(0,attrMod(c.attributes[attr]));
    target.hp-=dmg;
    log(`<span class="dmg">💥 ${target.name} sofre ${dmg} de dano. (PV ${Math.max(0,target.hp)}/${target.maxHp})</span>`);
    if(target.hp<=0){
      log(`<span class="ok">${target.name} está fora de combate.</span>`);
      c.xp+=25; narr('Você sobrevive mais um instante. A adrenalina cobra seu preço.');
    }
  } else {
    narr('O ataque não atinge o alvo.');
  }
  if(combat.enemies.every(e=>e.hp<=0)){ endCombat(); return; }
  enemyTurn();
}

function enemyTurn(){
  const c=S.character;
  const combat=S.combat;
  combat.enemies.filter(e=>e.hp>0).forEach(e=>{
    const atk=rnd(20)+e.atk;
    const ac = 10 + attrMod(c.attributes.des) + 2 + (c._cover?2:0);
    if(atk>=ac){
      const dmg=e.dmg + (e.dmg>1?0:0);
      c.hp-=dmg;
      log(`<span class="dmg">🗡 ${e.name} acerta você — ${dmg} de dano. (PV ${Math.max(0,c.hp)}/${c.maxHp})</span>`);
    } else {
      log(`<span style="color:var(--muted)">${e.name} erra.</span>`);
    }
  });
  c._cover=false;
  combat.round++;
  if(c.hp<=0){ playerDown(); return; }
  renderStatus(); saveLocal();
}

function playerDown(){
  narr('O chão vem. O som se afasta. Você cai — e o mundo continua girando sem você.');
  log('<b class="dmg">Você foi gravemente ferido. Role /rolar d20 para o destino:</b>','dmg');
  log('<i>1-9: morte ou captura. 10-14: sobrevive, marcado. 15-20: resgatado por alguém.</i>','narr');
  S.combat=null;
  S.flags.downed=true;
  renderStatus();
}

function endCombat(){
  narr('O silêncio retorna, mais pesado do que antes.');
  S.combat=null;
  const c=S.character;
  c.xp+=25;
  checkLevelUp();
  renderStatus(); saveLocal();
}

function checkLevelUp(){
  const c=S.character;
  const threshold = c.level*100;
  if(c.xp>=threshold){
    c.level++; c.xp-=threshold;
    c.maxHp+=3; c.hp=c.maxHp;
    c.maxSanity+=1; c.sanity=c.maxSanity;
    log(`<span class="ok">★ Você sobe para o nível ${c.level}. PV e sanidade restaurados.</span>`);
  }
}

// ==================== PROLOGOS ====================
function openPrologue(){
  const c=S.character;
  const perKey = S.creation ? null : null;
  const per = Object.values(PERIODS).find(p=>p.y===S.world.year && p.m===S.world.month) || PERIODS.p1944;
  narr(`<i>${S.world.day} de ${monthName(S.world.month)} de ${S.world.year}. ${S.world.location}.</i>`);
  narr(baseOpening());
  presentOpeningChoices();
}

function monthName(m){
  return ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][m-1]||'—';
}

function baseOpening(){
  const c=S.character;
  const y=S.world.year;
  const nat=c.nation;
  // Adapta nacionalidade + período
  if(y===1939) {
    if(nat==='Polônia') return 'O rádio crepita. As primeiras notícias falam de movimentação alemã na fronteira. Varsóvia ainda finge normalidade — mas você sabe. Você conhece o cheiro do que vem aí.';
    if(nat==='Alemanha') return 'A ordem chegou antes do amanhecer. Você está pronto, uniformizado, e a fronteira polonesa está logo à frente. A propaganda diz que é uma guerra defensiva. Você não tem certeza.';
    return 'A Europa está em suspenso. Ainda se fala em negociação — mas os que sabem ler o momento já sabem: a guerra é uma questão de dias, não de meses.';
  }
  if(y===1940) {
    if(nat==='França') return 'A linha Maginot parecia invencível. Não foi. As colunas alemãs avançam para o Canal, e o que resta é escolher: resistir, fugir, ou se calar.';
    if(nat==='Reino Unido') return 'A RAF decola. O Canal da Mancha nunca pareceu tão estreito. A Batalha da Inglaterra está no ar — literalmente.';
    return 'A França está caindo. A Inglaterra respira fundo. O mundo assiste, atônito, ao desmoronamento de uma ordem que parecia eterna.';
  }
  if(y===1941) {
    if(nat==='União Soviética') return 'A fronteira oeste arde. Não há aviso prévio, não há declaração — apenas aço, fumaça e a certeza de que a Guerra Patriótica começou.';
    if(nat==='Estados Unidos') return 'Pearl Harbor. O rádio repete a notícia em loop. A América, enfim, está em guerra.';
    if(nat==='Japão') return 'O Império avança. Cada vitória parece eterna. Mas há algo no ar que ninguém ousa dizer em voz alta.';
    return 'A guerra se tornou mundial. Da Rússia ao Pacífico, o fogo se alastra.';
  }
  if(y===1942) {
    if(nat==='União Soviética') return 'Stalingrado. Casa por casa, rua por rua. Um inferno de escombros. Cada metro custa sangue — dos dois lados.';
    if(nat==='Alemanha') return 'A ordem é manter a posição. Stalingrado é o nome do inferno. Você está nele.';
    if(nat==='Reino Unido'||nat==='Austrália') return 'O deserto africano. El Alamein. Poeira, calor, e a sensação de que o Eixo chegou ao seu limite.';
    return 'O ano em que o mundo começa a virar — mas ainda do jeito mais doloroso possível.';
  }
  if(y===1943) {
    if(nat==='Brasil') return 'A FEB desembarca na Itália. Você está longe de casa, num país que não é o seu, por motivos que talvez não consiga explicar a quem ficou.';
    if(nat==='Itália') return 'Mussolini caiu. A Itália está dividida — e a guerra não terminou, apenas mudou de forma.';
    return 'A Itália. Salerno. A guerra se aproxima do coração do Eixo europeu.';
  }
  if(y===1944) {
    if(nat==='Brasil') return 'Monte Castello. A neve, a lama, a artilharia. A FEB está aqui — e o Brasil descobriu que a guerra não cabe nos jornais.';
    if(nat==='Estados Unidos'||nat==='Reino Unido'||nat==='Canadá') return 'Normandia. 6 de junho. A praia é um inferno de aço e água. Você está nela.';
    if(nat==='França') return 'A Resistência respira. Paris ainda não é livre — mas já sente o cheiro da libertação.';
    return 'A libertação começou. Cada avanço custa vidas. Cada vila tem um nome, e cada nome, uma história.';
  }
  if(y===1945) {
    if(nat==='Alemanha') return 'Berlim é um esqueleto. As ruas cheiram a fumaça e a medo. O fim está próximo — mas ninguém sabe o que resta depois dele.';
    if(nat==='Estados Unidos'||nat==='União Soviética'||nat==='Reino Unido') return 'A Alemanha desaba. Berlim. O fim de um pesadelo que parecia não ter fim.';
    return 'O fim da guerra na Europa. E o início de um mundo novo — que ninguém sabe ao certo o que será.';
  }
  return 'A guerra. Em algum lugar entre o horror e a rotina, você está nela.';
}

function presentOpeningChoices(){
  const c=S.character;
  const ch=[
    {label:'Observar os arredores com cuidado', match:['observ','olh','examin'],
      run:()=>{ 
        const res=doCheck('per','reconhecimento',10);
        dice(fmtCheck(res,'Observar o ambiente'));
        if(res.success){ narr('Você percebe detalhes que outros deixam passar: um movimento suspeito, uma porta entreaberta, um cheiro de pólvora que não deveria estar ali.'); addMission('Investigar o movimento suspeito'); }
        else narr('Nada de imediato. O ambiente parece opaco, reservado.');
      }},
    {label:'Conversar com quem está próximo', match:['fal','convers','pergunt','contat'],
      run:()=>{ 
        const res=doCheck('car','persuasao',10);
        dice(fmtCheck(res,'Abordagem social'));
        if(res.success){ narr('A conversa flui. Um nome, um detalhe, uma informação — você já não está sozinho.'); addContact('Sargento Almeida','Veterano, desconfiado mas leal'); }
        else narr('A conversa trava. Desconfiança. Talvez em outro momento.');
      }},
    {label:'Verificar seu equipamento', match:['equip','arma','invent','verific'],
      run:()=>{ 
        narr('Você revisa o que tem. Nem tudo está em ordem, mas o essencial está lá.');
        cmdInv();
        addMission('Preparar-se para o que vem');
      }},
    {label:'Seguir em frente, sem esperar', match:['avanç','segu','march','ir ','vam'],
      run:()=>{ 
        narr('Você não espera. O tempo é curto, e cada minuto pode ser a diferença entre viver e morrer.');
        addMission('Avançar para a próxima posição');
      }}
  ];
  ch.forEach((o,i)=>log(`<span class="choice">[${i+1}] ${o.label}</span>`,''));
  S.scene = { choices: ch.map(o=>({match:o.match, run:o.run})) };
}

function addMission(t){
  S.character.missionsActive.push({title:t});
  sys(`Missão adicionada: ${t}`);
}
function addContact(name,desc){
  S.character.contacts.push({name,desc});
}

// ==================== SAVE / LOAD ====================
function exportSave(){
  try{
    const data = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const blob = new Blob([data],{type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='sombras-da-guerra-save.txt';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    sys('✔ Save exportado. Guarde o arquivo — ele contém toda a campanha.');
  }catch(e){ sys('Falha ao exportar: '+e.message); }
}

function importSavePrompt(){
  const data = prompt('Cole o conteúdo do save (texto longo) ou use o arquivo baixado em /carregar:');
  if(!data) return;
  try{
    const json = decodeURIComponent(escape(atob(data.trim())));
    const parsed = JSON.parse(json);
    if(!parsed.character){ alert('Save inválido.'); return; }
    S=parsed;
    saveLocal();
    showGame();
    narr('Campanha restaurada.');
  }catch(e){
    alert('Falha ao importar: '+e.message);
  }
}
